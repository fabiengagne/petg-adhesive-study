<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
 <defs>
  <marker id="dimArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
   <path d="M0,1 L9,5 L0,9 Z" fill="#000"/>
  </marker>
 </defs>
 <rect width="1200" height="850" fill="#fff"/>
 <g font-family="Arial,Helvetica,sans-serif" fill="#000">
  <text x="600" y="42" text-anchor="middle" font-size="28">Adhesive test specimen geometry</text>
  <rect x="40" y="72" width="385" height="112" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="58" y="105" font-size="19">Dimensions in mm</text>
  <text x="58" y="136" font-size="19">Bonded area: 490.9 mm²</text>
  <text x="58" y="167" font-size="19">Orthographic views, not to scale</text>
 </g>
 <!-- Side view: corrected STL, nominal dimensions -->
 <g fill="none" stroke="#000">
  <path d="M120 640 L500 640 L500 592 L470 568 L470 410 L150 410 L150 568 L120 592 Z" stroke-width="3"/>
  <line x1="310" y1="382" x2="310" y2="670" stroke-width="1.4" stroke-dasharray="18 6 3 6"/>
  <!-- Overall height dimension, extension lines offset from object -->
  <line x1="510" y1="640" x2="560" y2="640" stroke-width="1.2"/>
  <line x1="480" y1="410" x2="560" y2="410" stroke-width="1.2"/>
  <line x1="548" y1="638" x2="548" y2="412" stroke-width="1.3" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <!-- Base thickness, from bonded face to shoulder -->
  <line x1="114" y1="640" x2="66" y2="640" stroke-width="1.2"/>
  <line x1="114" y1="592" x2="66" y2="592" stroke-width="1.2"/>
  <line x1="78" y1="638" x2="78" y2="594" stroke-width="1.3" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <!-- Base diameter in side view -->
  <line x1="120" y1="650" x2="120" y2="789" stroke-width="1.2"/>
  <line x1="500" y1="650" x2="500" y2="789" stroke-width="1.2"/>
  <line x1="122" y1="777" x2="498" y2="777" stroke-width="1.3" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <!-- Bonded face leader -->
  <line x1="310" y1="697" x2="310" y2="648" stroke-width="1.2" marker-end="url(#dimArrow)"/>
 </g>
 <g font-family="Arial,Helvetica,sans-serif" fill="#000">
  <text x="310" y="375" text-anchor="middle" font-size="23">Side view</text>
  <text x="570" y="530" font-size="20">13.0 mm</text>
  <text x="78" y="580" text-anchor="middle" font-size="18">3.0 mm</text>
  <text x="310" y="727" text-anchor="middle" font-size="20">Bonded face</text>
  <text x="310" y="808" text-anchor="middle" font-size="20">Ø25.0 mm base</text>
 </g>
 <!-- Bonded face view -->
 <g fill="none" stroke="#000">
  <circle cx="900" cy="300" r="150" stroke-width="3"/>
  <line x1="728" y1="300" x2="1072" y2="300" stroke-width="1.4" stroke-dasharray="18 6 3 6"/>
  <line x1="900" y1="128" x2="900" y2="472" stroke-width="1.4" stroke-dasharray="18 6 3 6"/>
  <!-- diameter dimension above, standard inward-facing endpoints on extension lines -->
  <line x1="750" y1="142" x2="750" y2="92" stroke-width="1.2"/>
  <line x1="1050" y1="142" x2="1050" y2="92" stroke-width="1.2"/>
  <line x1="752" y1="104" x2="1048" y2="104" stroke-width="1.3" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
 </g>
 <g font-family="Arial,Helvetica,sans-serif" fill="#000">
  <text x="900" y="68" text-anchor="middle" font-size="23">Bonded face view</text>
  <text x="900" y="96" text-anchor="middle" font-size="20">Ø25.0 mm</text>
 </g>
 <!-- Hex end view, point-up; 21 mm across vertical flats shown horizontally -->
 <g fill="none" stroke="#000">
  <polygon points="900,540 1005,601 1005,723 900,784 795,723 795,601" stroke-width="3"/>
  <line x1="773" y1="662" x2="1027" y2="662" stroke-width="1.4" stroke-dasharray="18 6 3 6"/>
  <line x1="900" y1="518" x2="900" y2="806" stroke-width="1.4" stroke-dasharray="18 6 3 6"/>
  <!-- across-flats dimension below, clear of geometry -->
  <line x1="795" y1="730" x2="795" y2="822" stroke-width="1.2"/>
  <line x1="1005" y1="730" x2="1005" y2="822" stroke-width="1.2"/>
  <line x1="797" y1="810" x2="1003" y2="810" stroke-width="1.3" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
 </g>
 <g font-family="Arial,Helvetica,sans-serif" fill="#000">
  <text x="900" y="505" text-anchor="middle" font-size="23">Hex drive end view</text>
  <text x="900" y="842" text-anchor="middle" font-size="20">21.0 mm across flats</text>
 </g>
</svg>